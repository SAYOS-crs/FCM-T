<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FCM Token & Notification Tester [Vercel Edition]</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <div class="container">
            <!-- Main Vercel-Style Window Card -->
            <div class="terminal-window">
                <!-- Top Navigation Bar -->
                <div class="terminal-header">
                    <div class="window-controls">
                        <div class="vercel-logo" title="FCM-Kernel Push Tester">
                            <svg height="16" viewBox="0 0 115 100" fill="currentColor">
                                <path d="M57.5 0L115 100H0L57.5 0z"></path>
                            </svg>
                        </div>
                        <div class="window-title">
                            <span class="repo-name">fcm-kernel</span>
                            <span style="color: var(--border-hover)">/</span>
                            <span>push-tester</span>
                            <span class="env-badge">Production</span>
                        </div>
                    </div>
                    <div class="status-badge">
                        <span
                            id="sw-status-indicator"
                            class="status-indicator"
                        ></span>
                        <span id="sw-status-text">SW: Unregistered</span>
                    </div>
                </div>

                <!-- Main Grid Body -->
                <div class="terminal-body">
                    <!-- Left Panel: Configuration Form -->
                    <div class="panel">
                        <div class="panel-title">
                            <span>Project Configuration</span>
                        </div>

                        <!-- Quick JSON Paste Box -->
                        <div class="json-quick-paste">
                            <label for="json-paste"
                                >Quick Paste Firebase Config (JS Object / JSON)</label
                            >
                            <textarea
                                id="json-paste"
                                class="form-textarea"
                                rows="3"
                                placeholder='Paste raw config here e.g. { apiKey: "...", projectId: "..." }'
                            ></textarea>
                            <div
                                style="
                                    margin-top: 4px;
                                    display: flex;
                                    justify-content: flex-end;
                                "
                            >
                                <button
                                    id="btn-parse-json"
                                    class="btn btn-sm btn-secondary"
                                >
                                    Auto-fill Fields
                                </button>
                            </div>
                        </div>

                        <!-- Individual Config Fields -->
                        <div class="grid-2col">
                            <div class="form-group">
                                <label class="form-label" for="cfg-apiKey"
                                    >API Key <span class="req">*</span></label
                                >
                                <input
                                    type="text"
                                    id="cfg-apiKey"
                                    class="form-control"
                                    placeholder="AIzaSy..."
                                />
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="cfg-projectId"
                                    >Project ID
                                    <span class="req">*</span></label
                                >
                                <input
                                    type="text"
                                    id="cfg-projectId"
                                    class="form-control"
                                    placeholder="my-app-123"
                                />
                            </div>
                        </div>

                        <div class="grid-2col">
                            <div class="form-group">
                                <label class="form-label" for="cfg-authDomain"
                                    >Auth Domain</label
                                >
                                <input
                                    type="text"
                                    id="cfg-authDomain"
                                    class="form-control"
                                    placeholder="my-app.firebaseapp.com"
                                />
                            </div>
                            <div class="form-group">
                                <label
                                    class="form-label"
                                    for="cfg-storageBucket"
                                    >Storage Bucket</label
                                >
                                <input
                                    type="text"
                                    id="cfg-storageBucket"
                                    class="form-control"
                                    placeholder="my-app.firebasestorage.app"
                                />
                            </div>
                        </div>

                        <div class="grid-2col">
                            <div class="form-group">
                                <label
                                    class="form-label"
                                    for="cfg-messagingSenderId"
                                    >Messaging Sender ID
                                    <span class="req">*</span></label
                                >
                                <input
                                    type="text"
                                    id="cfg-messagingSenderId"
                                    class="form-control"
                                    placeholder="1234567890"
                                />
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="cfg-appId"
                                    >App ID <span class="req">*</span></label
                                >
                                <input
                                    type="text"
                                    id="cfg-appId"
                                    class="form-control"
                                    placeholder="1:1234:web:abcd"
                                />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="cfg-measurementId"
                                >Measurement ID (Optional)</label
                            >
                            <input
                                type="text"
                                id="cfg-measurementId"
                                class="form-control"
                                placeholder="G-XXXXXXXXXX"
                            />
                        </div>

                        <hr
                            style="
                                border: 0;
                                border-top: 1px solid var(--border-subtle);
                            "
                        />

                        <!-- Dynamic VAPID Key Input -->
                        <div class="form-group">
                            <label class="form-label" for="cfg-vapidKey">
                                Web Push VAPID Key <span class="req">*</span>
                            </label>
                            <input
                                type="text"
                                id="cfg-vapidKey"
                                class="form-control"
                                placeholder="BEl8..."
                            />
                        </div>

                        <!-- Target API Endpoint Input -->
                        <div class="form-group">
                            <label class="form-label" for="cfg-apiEndpoint">
                                Target API Endpoint URL
                            </label>
                            <input
                                type="url"
                                id="cfg-apiEndpoint"
                                class="form-control"
                                placeholder="https://httpbin.org/post"
                            />
                        </div>

                        <!-- Target API Authorization Token Input -->
                        <div class="form-group">
                            <label class="form-label" for="cfg-apiAuthToken">
                                Authorization / Bearer Token (Optional)
                            </label>
                            <input
                                type="text"
                                id="cfg-apiAuthToken"
                                class="form-control"
                                placeholder="e.g. your_jwt_token or User your_jwt_token"
                            />
                        </div>

                        <div class="btn-group" style="margin-top: 0.5rem">
                            <button id="btn-load-preset" class="btn btn-sm">
                                Load Default Preset
                            </button>
                            <button
                                id="btn-save-config"
                                class="btn btn-sm btn-secondary"
                            >
                                Save to LocalStorage
                            </button>
                        </div>
                    </div>

                    <!-- Right Panel: Controls & Live System Log Stream -->
                    <div class="panel log-stream-panel">
                        <div class="panel-title">
                            <span>Execution & Live System Logs</span>
                        </div>

                        <!-- Primary Control Action Buttons -->
                        <div class="btn-group">
                            <button id="btn-get-token" class="btn btn-primary">
                                Get FCM Token
                            </button>
                            <button
                                id="btn-send-endpoint"
                                class="btn btn-secondary"
                            >
                                POST Token to API Endpoint
                            </button>
                            <button
                                id="btn-test-notif"
                                class="btn btn-sm"
                                title="Test if browser notification popups work locally"
                            >
                                Test Notification
                            </button>
                            <button
                                id="btn-clear-logs"
                                class="btn btn-sm"
                                style="margin-left: auto"
                            >
                                Clear Logs
                            </button>
                        </div>

                        <!-- Active Token Output Box -->
                        <div class="token-container">
                            <div class="token-header">
                                <span>Active FCM Registration Token</span>
                                <button
                                    id="btn-copy-token"
                                    class="btn btn-sm"
                                    style="padding: 2px 8px"
                                >
                                    Copy
                                </button>
                            </div>
                            <div id="token-output" class="token-display">
                                -- No token generated yet --
                            </div>
                        </div>

                        <!-- Terminal Output Stream -->
                        <div id="terminal-logs" class="terminal-log-box">
                            <!-- Dynamic logs will be appended here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="./app.js"></script>
    </body>
</html>
